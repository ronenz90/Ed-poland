name: Deploy site with fresh weather

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site and fetch weather
        run: |
          mkdir _site
          cp index.html _site/
          python3 scripts/fetch_weather.py _site/weather.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
