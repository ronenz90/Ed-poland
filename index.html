<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>עדים במדים 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap">
<style>
/* Layout: sticky control bar over a single reading column; timeline rows with a time gutter, dress-code colour as the one running signal. */
:root{
  --bg:#f3f7f6; --surface:#ffffff; --ink:#12272b; --muted:#566b6f; --line:#dce6e4;
  --accent:#0f6b73; --accent-soft:#dff0ef; --on-accent:#ffffff;
  --m:#55663a; --m-bg:#e9efdc;
  --h:#3b5d8a; --h-bg:#e2ebf6;
  --c:#97661a; --c-bg:#f8ecd6;
  --warn:#b4541a; --warn-bg:#fbe9de;
  --rain:#2f6fb3; --good:#2e7d52; --good-bg:#e1f2e8;
  --shadow:0 1px 2px rgba(18,39,43,.06),0 4px 14px rgba(18,39,43,.05);
  --f-display:"Frank Ruhl Libre","David Libre",Georgia,serif;
  --f-body:"Assistant","Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a1c; --surface:#16262a; --ink:#e7f0ef; --muted:#9db3b6; --line:#27393d;
  --accent:#5fc1c9; --accent-soft:#183b3f; --on-accent:#08191b;
  --m:#b5c98a; --m-bg:#25301a;
  --h:#8db4e6; --h-bg:#1b2c42;
  --c:#e2b46c; --c-bg:#3a2d14;
  --warn:#f0a275; --warn-bg:#3b2315;
  --rain:#7db4ee; --good:#7fd0a0; --good-bg:#17301f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a1c; --surface:#16262a; --ink:#e7f0ef; --muted:#9db3b6; --line:#27393d;
  --accent:#5fc1c9; --accent-soft:#183b3f; --on-accent:#08191b;
  --m:#b5c98a; --m-bg:#25301a;
  --h:#8db4e6; --h-bg:#1b2c42;
  --c:#e2b46c; --c-bg:#3a2d14;
  --warn:#f0a275; --warn-bg:#3b2315;
  --rain:#7db4ee; --good:#7fd0a0; --good-bg:#17301f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl;padding-inline:16px;padding-block:0 48px;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin-inline:auto}
h1,h2,h3{font-family:var(--f-display);line-height:1.2;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* top */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:20px 12px}
.top h1{font-size:clamp(1.7rem,5vw,2.5rem);font-weight:900}
.top .sub{color:var(--muted);margin-top:4px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px}
.btn:hover{border-color:var(--accent)}

/* sticky controls */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.bar-in{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;overflow-x:auto}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;padding:8px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.days{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.dchip{flex:1 0 auto;min-width:78px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;text-align:center;line-height:1.25}
.dchip b{display:block;font-size:.95rem}
.dchip span{font-size:.78rem;color:var(--muted)}
.dchip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.dchip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-start:4px}

main{padding-block:16px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.25rem;margin-bottom:10px}
.card h3{font-size:1.05rem;margin-bottom:6px}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}

/* now card */
.now{border-color:var(--accent);background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)),var(--surface)}
.now .big{font-family:var(--f-display);font-size:1.5rem;font-weight:700}
.now .cd{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cd div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;min-width:64px}
.cd b{display:block;font-size:1.4rem}
.cd span{font-size:.75rem;color:var(--muted)}

/* chips */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:600;white-space:nowrap}
.d-M{background:var(--m-bg);color:var(--m)} .d-H{background:var(--h-bg);color:var(--h)} .d-C{background:var(--c-bg);color:var(--c)}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.good{background:var(--good-bg);color:var(--good)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.pill.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.pill.rain{background:var(--accent-soft);color:var(--rain)}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.sw-M{background:var(--m)} .sw-H{background:var(--h)} .sw-C{background:var(--c)}

/* day head */
.dayhead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.dayhead h2{font-size:1.6rem;margin:0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.wxrow{display:flex;gap:10px;flex-wrap:wrap}
.wxbox{border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:150px;flex:1 1 150px}
.wxbox b{font-size:1.15rem}
.est{font-size:.75rem;color:var(--muted)}

/* timeline */
.tl{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:72px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.time{font-weight:700;font-size:.95rem;line-height:1.2}
.time small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.row .body{min-width:0;border-inline-start:4px solid var(--line);padding-inline-start:12px}
.row.d-Mr .body{border-color:var(--m)} .row.d-Hr .body{border-color:var(--h)} .row.d-Cr .body{border-color:var(--c)}
.ttl{font-weight:700}
.note{color:var(--muted);font-size:.92rem;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.row.live{background:var(--accent-soft);border-radius:10px;padding-inline:8px;margin-inline:-8px}
.row.past{opacity:.55}
.chg{margin:6px 0;padding:8px 12px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:.9rem;font-weight:600}
.drive{background:var(--bg);border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin-block:2px}

/* two-day */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:minmax(0,1fr)}}
.two .row{grid-template-columns:58px 1fr;gap:8px}

/* hourly */
.hr{display:grid;grid-template-columns:54px 62px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:start}
.hr:first-child{border-top:0}
.hr .h{font-weight:700}
.hr.live{background:var(--accent-soft);border-radius:10px;padding-inline:8px;margin-inline:-8px}
.hr.dark{background:linear-gradient(0deg,rgba(0,0,0,.05),rgba(0,0,0,.05))}
.hr .t{font-size:.92rem}
.hr .t small{display:block;color:var(--muted)}
.hitem{padding:4px 0 4px 0;border-inline-start:4px solid var(--line);padding-inline-start:10px;margin-bottom:4px}
.hitem.d-Mr{border-color:var(--m)} .hitem.d-Hr{border-color:var(--h)} .hitem.d-Cr{border-color:var(--c)}
.sun{font-size:.82rem;color:var(--warn);font-weight:600}

/* trip */
.trip{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.trip .card{display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:start}
.trip .card:hover{border-color:var(--accent)}
.range{position:relative;height:8px;background:var(--line);border-radius:999px;margin-block:6px}
.range i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--accent)}
.scale{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted)}

/* pack */
.pk{display:flex;flex-direction:column;gap:2px}
.pk label{display:flex;gap:10px;align-items:flex-start;padding:8px 6px;border-radius:8px;cursor:pointer}
.pk label:hover{background:var(--bg)}
.pk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.pk input:checked+span{text-decoration:line-through;color:var(--muted)}
.prog{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);width:0}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem}
.scroll{overflow-x:auto}
.sim{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem;color:var(--muted)}
.sim input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;min-height:40px}
.src a{color:var(--accent)}
.src li{margin-bottom:4px}
.flag{border-inline-start:4px solid var(--warn);padding-inline-start:12px;margin-block:8px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

function renderBar(){
  var seen = {};
  document.querySelectorAll("#views button").forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-v") === state.view)); });
  var showDays = state.view !== "trip" && state.view !== "pack";
  var box = $("#days"); box.hidden = !showDays;
  var live = liveDayIndex();
  box.innerHTML = DAYS.map(function(d, i){
    var on = state.view === "two" ? (i === Math.min(state.day - 1, 3) || i === Math.min(state.day - 1, 3) + 1) : (i === state.day - 1);
    var dots = dressSeq(d).map(function(s){ return '<i class="sw sw-' + s.d + '"></i>'; }).join("");
    return '<button type="button" class="dchip num" data-d="' + (i + 1) + '" aria-pressed="' + on + '"><b>יום ' + DS[i] + (i === live ? " · עכשיו" : "") + "</b><span>" + d.date + ".10 " + dots + "</span></button>";
  }).join("");
  $("#tzBtn").textContent = "שעון: " + tzLabel().replace("שעון ", "");
}
function renderNow(){
  var box = $("#nowbox");
  if(document.activeElement && document.activeElement.id === "simIn") return;
  box.innerHTML = nowCard();
  var inp = $("#simIn");
  if(inp){
    if(state.sim !== null){
      var d = new Date(state.sim + 2 * 3600000);
      inp.value = d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes());
    }
    inp.addEventListener("change", function(){
      var m = /^(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(inp.value);
      if(!m){ return; }
      state.sim = Date.UTC(+m[1], +m[2] - 1, +m[3], +m[4] - 2, +m[5]);
      var di = liveDayIndex(); if(di >= 0) state.day = di + 1;
      renderAll();
    });
    $("#simClr").addEventListener("click", function(){ state.sim = null; renderAll(); });
  }
}
function renderView(){
  var v = $("#view"), di = state.day - 1, h = "";
  if(state.view === "day") h = dayView(di, false);
  else if(state.view === "two") h = twoView();
  else if(state.view === "hour") h = hourView(di);
  else if(state.view === "trip") h = tripView();
  else h = packView();
  v.innerHTML = h;
}
function renderFoot(){
  var live = Object.keys(LIVE).map(function(k){ return '<a href="' + LIVE[k][1] + '" target="_blank" rel="noopener">' + LIVE[k][0] + "</a>"; }).join(" · ");
  $("#foot").innerHTML = "<h3>מקורות והערות</h3><ul>" +
    SRC.map(function(s){ return '<li><a href="' + s[1] + '" target="_blank" rel="noopener">' + esc(s[0]) + "</a></li>"; }).join("") +
    "<li>תחזית חיה במפה: " + live + "</li></ul>" +
    '<p class="muted">' + wxSentence() + ' הלו״ז עצמו נלקח מהקובץ שצורף. המלצות הלבוש, השינה והציוד הן המלצות כלליות ולא חלק מהלו״ז.</p>';
}
function renderAll(){ renderBar(); renderNow(); renderView(); }
function applyTheme(){
  var r = document.documentElement;
  if(state.theme) r.setAttribute("data-theme", state.theme); else r.removeAttribute("data-theme");
  var dark = state.theme === "dark" || (!state.theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  $("#themeBtn").textContent = dark ? "מצב בהיר" : "מצב כהה";
}

load();
$("#main").innerHTML = '<div id="nowbox"></div><div id="view"></div>';
var li = liveDayIndex(); if(li >= 0) state.day = li + 1;
if(state.day < 1 || state.day > 5) state.day = 1;
applyTheme(); renderAll(); renderFoot();
try{
  fetch("weather.json?_=" + Date.now(), {cache:"no-store"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if(applyLive(j)){ renderAll(); renderFoot(); } })
    .catch(function(){});
}catch(e){}

$("#views").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  state.view = b.getAttribute("data-v"); save(); renderAll(); window.scrollTo(0, 0);
});
$("#days").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  state.day = +b.getAttribute("data-d"); save(); renderAll();
});
$("#tzBtn").addEventListener("click", function(){
  state.tz = state.tz === "pl" ? "il" : (state.tz === "il" ? "dev" : "pl"); save(); renderAll();
});
$("#themeBtn").addEventListener("click", function(){
  var dark = state.theme === "dark" || (!state.theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  state.theme = dark ? "light" : "dark"; save(); applyTheme();
});
$("#view").addEventListener("click", function(e){
  var c = e.target.closest("article[data-d]");
  if(c){ state.day = +c.getAttribute("data-d"); state.view = "day"; save(); renderAll(); window.scrollTo(0, 0); }
});
$("#view").addEventListener("keydown", function(e){
  if(e.key !== "Enter") return;
  var c = e.target.closest("article[data-d]");
  if(c){ state.day = +c.getAttribute("data-d"); state.view = "day"; save(); renderAll(); window.scrollTo(0, 0); }
});
$("#view").addEventListener("change", function(e){
  var k = e.target.getAttribute("data-k"); if(!k) return;
  state.chk[k] = e.target.checked; save();
  var n = 0, t = 0;
  PACK.forEach(function(g){ g.i.forEach(function(x){ t++; if(state.chk[x[0]]) n++; }); });
  $("#pkc").textContent = n; $("#pkb").style.width = (t ? n / t * 100 : 0) + "%";
});
setInterval(function(){ if(state.sim === null){ renderNow(); if(state.view !== "pack") renderView(); } }, 60000);
</script>
</body>
</html>
